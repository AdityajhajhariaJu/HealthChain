name: Lighthouse CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        # Match the production CSP without providing live database credentials.
        env:
          VITE_SUPABASE_URL: https://cikikocfvfshloqwnyfe.supabase.co
          VITE_SUPABASE_ANON_KEY: healthchain-ci-placeholder
        run: npm run build

      - name: Generate native configuration and assets
        run: |
          npx cap copy android
          npx cap copy ios

      - name: Run unit tests
        run: npm test -- --run
        
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './lighthouserc.cjs'
          uploadArtifacts: true
          temporaryPublicStorage: true
