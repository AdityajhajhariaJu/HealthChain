name: HealthChain Quality Gates

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Match package-lock's Playwright version. Preinstalled browsers/dependencies
    # avoid repeated, variable-duration Ubuntu mirror downloads.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out container workspace
        # The runner mounts a checkout owned by its host user into the container.
        # Trust this exact checkout only, rather than every repository path.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Supabase Realtime now expects the native WebSocket available in
          # current Node LTS releases, including during Vitest imports.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify preinstalled browser version
        run: |
          node --input-type=module <<'NODE'
          import { existsSync } from 'node:fs';
          import { chromium, webkit } from '@playwright/test';
          for (const browser of [chromium, webkit]) {
            if (!existsSync(browser.executablePath())) {
              throw new Error(`${browser.name()} is missing. Match the CI image to package-lock's Playwright version.`);
            }
          }
          console.log('Matching Chromium and WebKit executables are preinstalled.');
          NODE

      - name: Audit application and development dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Validate repository hygiene
        run: npm run verify:repository

      - name: Validate serverless API syntax
        shell: bash
        run: |
          for file in api/*.js server/*.js shared/*.js; do
            node --check "$file"
          done

      - name: Validate Supabase migration contract
        run: npm run verify:migrations

      - name: Production build
        run: npm run build

      - name: Generate native configuration and assets
        run: |
          npx cap copy android
          npx cap copy ios

      - name: Unit tests
        run: npm test -- --run

      - name: Browser smoke tests
        run: npm run e2e -- --project=chromium --project=webkit

  supabase-smoke:
    name: Live Supabase smoke (when configured)
    # Enable by setting the repository variable ENABLE_SUPABASE_SMOKE=true and
    # the two matching repository secrets. The variable avoids exposing secret
    # values in a job-level conditional.
    if: ${{ vars.ENABLE_SUPABASE_SMOKE == 'true' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run read-only Supabase smoke check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run smoke:supabase
