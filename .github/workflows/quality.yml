name: HealthChain Quality Gates

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Validate serverless API syntax
        shell: bash
        run: |
          for file in api/*.js api/utils/*.js; do
            node --check "$file"
          done

      - name: Unit tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Install browsers for smoke tests
        run: npx playwright install --with-deps chromium webkit

      - name: Browser smoke tests
        run: npm run e2e -- --project=chromium --project=webkit
