name: HealthChain Quality Gates

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level=high || true

      - name: Lint
        run: pnpm run lint

      - name: Validate serverless API syntax
        shell: bash
        run: |
          for file in api/*.js api/utils/*.js; do
            node --check "$file"
          done

      - name: Validate Supabase migration contract
        run: pnpm run verify:migrations

      - name: Unit tests
        run: pnpm test --run

      - name: Production build
        run: pnpm run build

      - name: Install browsers for smoke tests
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Browser smoke tests
        run: pnpm run e2e --project=chromium --project=webkit

  supabase-smoke:
    name: Live Supabase smoke (when configured)
    # Enable by setting the repository variable ENABLE_SUPABASE_SMOKE=true and
    # the two matching repository secrets. The variable avoids exposing secret
    # values in a job-level conditional.
    if: ${{ vars.ENABLE_SUPABASE_SMOKE == 'true' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run read-only Supabase smoke check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm run smoke:supabase
