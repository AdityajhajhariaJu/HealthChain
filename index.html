    <style>
      #hc-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        background: #F4FBF7;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
      }
      .hc-splash-logo-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      .hc-splash-logo-bg {
        position: absolute;
        width: 110px;
        height: 110px;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, rgba(16, 185, 129, 0) 70%);
        border-radius: 50%;
        animation: pulseBg 2.5s infinite ease-in-out;
      }
      .hc-splash-logo {
        width: 72px;
        height: 72px;
        position: relative;
        z-index: 2;
        border-radius: 16px;
        object-fit: contain;
        filter: drop-shadow(0 4px 12px rgba(16, 185, 129, 0.15));
        animation: float 3s infinite ease-in-out;
      }
      .hc-splash-text {
        color: #0F172A;
        font-family: 'Inter', sans-serif;
        font-weight: 900;
        font-size: 28px;
        letter-spacing: -0.5px;
        animation: fadeInUp 0.8s ease-out forwards;
        opacity: 0;
        transform: translateY(10px);
      }
      .hc-splash-loader {
        margin-top: 32px;
        width: 140px;
        height: 4px;
        background: #E2E8F0;
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        opacity: 0;
        animation: fadeInUp 0.8s ease-out 0.2s forwards;
      }
      .hc-splash-loader::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, transparent, #059669, transparent);
        border-radius: 4px;
        animation: slide 1.5s infinite ease-in-out;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseBg {
        0% { transform: scale(0.8); opacity: 0.5; }
        50% { transform: scale(1.3); opacity: 1; }
        100% { transform: scale(0.8); opacity: 0.5; }
      }
      @keyframes slide {
        0% { left: -50%; }
        100% { left: 100%; }
      }
      @keyframes fadeInUp {
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
