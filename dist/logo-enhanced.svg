<svg xmlns="http://www.w3.org/2000/svg" width="280" height="48" viewBox="0 0 280 48" fill="none">
  <defs>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f766e" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Logo Icon -->
  <g filter="url(#shadow)">
    <!-- Background circle -->
    <circle cx="24" cy="24" r="22" fill="url(#tealGrad)" opacity="0.15"/>
    <!-- Chain link 1 (top-left) -->
    <path d="M16 14C16 11.2386 18.2386 9 21 9H23C25.7614 9 28 11.2386 28 14V18C28 20.7614 25.7614 23 23 23H21C18.2386 23 16 20.7614 16 18V14Z" stroke="url(#tealGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Chain link 2 (bottom-right) -->
    <path d="M20 30C20 27.2386 22.2386 25 25 25H27C29.7614 25 32 27.2386 32 30V34C32 36.7614 29.7614 39 27 39H25C22.2386 39 20 36.7614 20 34V30Z" stroke="url(#tealGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Connecting strand 1 -->
    <line x1="22" y1="23" x2="26" y2="25" stroke="url(#tealGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Helix cross-bars -->
    <line x1="19" y1="16" x2="25" y2="16" stroke="#0f766e" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="23" y1="32" x2="29" y2="32" stroke="#0f766e" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- Activity pulse -->
    <polyline points="8,24 12,24 14,19 17,29 19,24 22,24" stroke="#0f766e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>

  <!-- Typography -->
  <text x="60" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a">HealthChain</text>
  <text x="204" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#14b8a6">360</text>
</svg>
